name: Continuous Integration

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Node.js Checks
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and Typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Run Node Tests
        run: npm test

      # Go Checks
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Run Go Tests
        run: go test ./... -v

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Docker build check (Auth)
        run: docker build ./services/auth-service -t auth-test
      - name: Docker build check (Donor)
        run: docker build ./services/donor-service -t donor-test
