worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=1000r/m;

    upstream auth_service {
        server auth-service:3001;
    }

    upstream donor_service {
        server donor-service:3002;
    }

    upstream request_service {
        server request-service:3003;
    }

    upstream match_engine {
        server match-engine:3004;
    }

    server {
        listen 80;
        server_name localhost;

        # Auth Service
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Donor Service
        location /api/v1/donors/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://donor_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Request Service (WebSocket Support)
        location /api/v1/requests/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://request_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        # Match Engine
        location /api/v1/match/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://match_engine;
        }

        # Frontend
        location / {
            proxy_pass http://web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
